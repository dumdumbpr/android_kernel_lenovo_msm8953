name: Build Kernel for Lenovo TB-X304L (MSM8953)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y build-essential libncurses-dev flex bison libssl-dev \
          libelf-dev bc python3 git gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          ccache lz4 device-tree-compiler kmod

    - name: Install GCC 4.9 Toolchain
      run: |
        wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-10.0.0_r47.tar.gz
        mkdir -p toolchain
        tar -xzf android-10.0.0_r47.tar.gz -C toolchain
        echo "CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        ls -la toolchain/bin/aarch64-linux-android-{gcc,ld,nm,objcopy}

    - name: Configure Kernel
      run: |
        make O=out ARCH=arm64 lineageos_tb8704_defconfig
        
        ./scripts/config --file out/.config \
          -e CONFIG_OVERLAY_FS \
          -e CONFIG_OVERLAY_FS_REDIRECT_DIR \
          -e CONFIG_OVERLAY_FS_INDEX \
          -e CONFIG_FB_MSM \
          -e CONFIG_FB_MSM_MDSS \
          -e CONFIG_DRM_MSM \
          -d LTO \
          -d LTO_CLANG

    - name: Patch Source Code
      run: |
        # Fix prima Wi-Fi driver
        PRIMA_DIR="drivers/staging/prima"
        if [ -d "$PRIMA_DIR" ]; then
            sed -i '/enum ani_akm_type {/a \    ANI_AKM_TYPE_SAE = 7,' \
                "$PRIMA_DIR/CORE/MAC/inc/aniGlobal.h"
            
            find "$PRIMA_DIR" -name Makefile -exec sed -i \
                -e 's/-Wno-non-literal-null-conversion//g' \
                -e 's/-Wno-typedef-redefinition//g' \
                -e 's/-Wno-parentheses-equality//g' \
                -e 's/-Wno-pointer-bool-conversion//g' \
                -e 's/-Wno-enum-conversion//g' {} \;
        fi
        
        # Fix display drivers
        MDSS_DIR="drivers/video/fbdev/msm"
        if [ -d "$MDSS_DIR" ]; then
            grep -q "CONFIG_FB_MSM_MDSS_HDMI_PANEL" "$MDSS_DIR/mdss_fb.h" || \
                echo "#define CONFIG_FB_MSM_MDSS_HDMI_PANEL 1" >> "$MDSS_DIR/mdss_fb.h"
            
            find "$MDSS_DIR" -name "*.c" -exec sed -i \
                -e 's/^\([ \t]*\)pr_err(/\1\/\/pr_err(/g' {} \;
        fi
        
        find . -name Makefile -exec sed -i \
            -e 's/-Werror=date-time//g' \
            -e 's/-Werror=deprecated-declarations//g' {} \;

    - name: Build Kernel
      run: |
        make -j$(($(nproc)+1)) O=out ARCH=arm64 \
          CROSS_COMPILE=${CROSS_COMPILE} \
          LD=${CROSS_COMPILE}ld \
          NM=${CROSS_COMPILE}nm \
          OBJCOPY=${CROSS_COMPILE}objcopy \
          HOSTCC=gcc \
          HOSTCXX=g++ \
          KCFLAGS="-Wno-error -Wno-date-time -Wno-deprecated-declarations"

    - name: Verify Output
      run: |
        if [ ! -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "::error::Kernel image not found!"
          exit 1
        fi
        echo "Build successful! Display drivers included."
        file out/arch/arm64/boot/Image.gz-dtb
        strings out/arch/arm64/boot/Image.gz-dtb | grep -iE "overlay|mdss|msm"

    - name: Create Flashable ZIP
      run: |
        mkdir -p AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        
        cat > AnyKernel3/anykernel.sh <<'EOF'
        #!/bin/bash
        device.name1=TB-X304L
        block=/dev/block/bootdevice/by-name/boot
        
        ui_print() { echo -e "ui_print $1\nui_print" > /proc/self/fd/$1; }
        ui_print "Flashing TB-X304L kernel with display support..."
        
        dd if=$block of=/tmp/anykernel/orig_boot.img
        dd if=/tmp/anykernel/Image.gz-dtb of=$block
        
        ui_print "Kernel flashed! Display should work."
        EOF
        
        zip -r9 kernel-TB-X304L-display.zip AnyKernel3/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          out/arch/arm64/boot/Image.gz-dtb
          kernel-TB-X304L-display.zip
