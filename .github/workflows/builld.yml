name: Build Kernel for Lenovo TB-X304L (MSM8953)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y build-essential libncurses-dev flex bison libssl-dev \
          libelf-dev bc python3 git gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          ccache lz4 device-tree-compiler kmod

    - name: Install GCC 4.9 Toolchain
      run: |
        # Download verified GCC 4.9 for MSM8953
        wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-10.0.0_r47.tar.gz
        mkdir -p toolchain
        tar -xzf android-10.0.0_r47.tar.gz -C toolchain
        echo "CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        
        # Verify critical tools exist
        ls -la toolchain/bin/aarch64-linux-android-{gcc,ld,nm,objcopy}

    - name: Configure Kernel
      run: |
        # Use lineageos_tb8704_defconfig
        make O=out ARCH=arm64 lineageos_tb8704_defconfig
        
        # Apply essential config changes
        ./scripts/config --file out/.config \
          -e CONFIG_OVERLAY_FS \
          -e CONFIG_OVERLAY_FS_REDIRECT_DIR \
          -e CONFIG_OVERLAY_FS_INDEX \
          -d LTO \
          -d LTO_CLANG \
          -d COMPILE_HOST_TOOLS
        
        # Disable problematic modules if needed
        ./scripts/config --file out/.config \
          -d CONFIG_DRM_MSM \
          -d CONFIG_FB_MSM \
          -d CONFIG_DEBUG_FS

    - name: Build Kernel
      run: |
        # Build with explicit tool paths
        make -j$(($(nproc)+1)) O=out ARCH=arm64 \
          CROSS_COMPILE=${CROSS_COMPILE} \
          LD=${CROSS_COMPILE}ld \
          NM=${CROSS_COMPILE}nm \
          OBJCOPY=${CROSS_COMPILE}objcopy \
          OBJDUMP=${CROSS_COMPILE}objdump \
          STRIP=${CROSS_COMPILE}strip \
          HOSTCC=gcc \
          HOSTCXX=g++

    - name: Verify Output
      run: |
        if [ ! -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "::error::Kernel image not found!"
          exit 1
        fi
        echo "Build successful!"
        file out/arch/arm64/boot/Image.gz-dtb
        strings out/arch/arm64/boot/Image.gz-dtb | grep -i "overlay"

    - name: Create Flashable ZIP
      run: |
        mkdir -p AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        
        cat > AnyKernel3/anykernel.sh <<'EOF'
        #!/bin/bash
        device.name1=TB-X304L
        block=/dev/block/bootdevice/by-name/boot
        is_slot_device=0
        
        ui_print() { echo -e "ui_print $1\nui_print" > /proc/self/fd/$1; }
        ui_print "Flashing TB-X304L kernel..."
        
        dump_boot() {
          dd if=$block of=/tmp/anykernel/boot.img
          unpackbootimg -i /tmp/anykernel/boot.img -o /tmp/anykernel
        }
        
        write_boot() {
          mkbootimg --kernel Image.gz-dtb \
            --ramdisk /tmp/anykernel/ramdisk.gz \
            --cmdline "$(cat /tmp/anykernel/boot.img-cmdline)" \
            --base $(cat /tmp/anykernel/boot.img-base) \
            --pagesize $(cat /tmp/anykernel/boot.img-pagesize) \
            -o /tmp/anykernel/new_boot.img
          dd if=/tmp/anykernel/new_boot.img of=$block
        }
        
        set -e
        dump_boot
        write_boot
        ui_print "Kernel flashed successfully!"
        EOF
        
        # Add tools if available
        if [ -f "scripts/unpackbootimg" ]; then
          cp scripts/unpackbootimg AnyKernel3/
        fi
        if [ -f "scripts/mkbootimg" ]; then
          cp scripts/mkbootimg AnyKernel3/
        fi
        
        zip -r9 kernel-TB-X304L.zip AnyKernel3/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          out/arch/arm64/boot/Image.gz-dtb
          kernel-TB-X304L.zip
