name: Build Kernel for Lenovo TB-X304L (MSM8953)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y build-essential libncurses-dev flex bison libssl-dev \
          libelf-dev bc python3 git gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          ccache

    - name: Install AOSP Toolchain
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
        echo "CROSS_COMPILE=$(pwd)/aarch64-linux-android-4.9/bin/aarch64-linux-android-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV

    - name: Configure Kernel
      run: |
        # Verify defconfig exists
        DEFCONFIG="lineageos_tb8704_defconfig"
        if [ ! -f "arch/arm64/configs/${DEFCONFIG}" ]; then
          echo "::error::Defconfig ${DEFCONFIG} not found!"
          echo "Available defconfigs:"
          ls arch/arm64/configs/
          exit 1
        fi

        # Generate initial config
        make O=out ARCH=arm64 ${DEFCONFIG}

        # Enable OverlayFS
        ./scripts/config --file out/.config \
          -e CONFIG_OVERLAY_FS \
          -e CONFIG_OVERLAY_FS_REDIRECT_DIR \
          -e CONFIG_OVERLAY_FS_INDEX

    - name: Build Kernel
      run: |
        make -j$(nproc) O=out ARCH=arm64 \
          CROSS_COMPILE=${CROSS_COMPILE} \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu-

    - name: Verify Output
      run: |
        if [ ! -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "::error::Kernel image not found!"
          exit 1
        fi
        echo "Build successful!"
        file out/arch/arm64/boot/Image.gz-dtb

    - name: Create Flashable ZIP
      run: |
        mkdir -p AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        
        cat > AnyKernel3/anykernel.sh <<'EOF'
        #!/bin/bash
        device.name1=TB-X304L
        block=/dev/block/bootdevice/by-name/boot
        is_slot_device=0
        
        ui_print() { echo -e "ui_print $1\nui_print" > /proc/self/fd/$1; }
        ui_print "Flashing TB-X304L kernel..."
        
        dump_boot() {
          dd if=$block of=/tmp/anykernel/boot.img
          unpackbootimg -i /tmp/anykernel/boot.img -o /tmp/anykernel
        }
        
        write_boot() {
          mkbootimg --kernel Image.gz-dtb \
            --ramdisk /tmp/anykernel/ramdisk.gz \
            --cmdline "$(cat /tmp/anykernel/boot.img-cmdline)" \
            --base $(cat /tmp/anykernel/boot.img-base) \
            --pagesize $(cat /tmp/anykernel/boot.img-pagesize) \
            -o /tmp/anykernel/new_boot.img
          dd if=/tmp/anykernel/new_boot.img of=$block
        }
        
        set -e
        dump_boot
        write_boot
        ui_print "Kernel flashed successfully!"
        EOF
        
        zip -r9 kernel-TB-X304L.zip AnyKernel3/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          out/arch/arm64/boot/Image.gz-dtb
          kernel-TB-X304L.zip
